<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mostafa Mohamed — AI Student</title>
<meta name="description" content="Portfolio of Mostafa Mohamed: AI student, CS undergraduate, Python and baseline ML workflows.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0F17; --surface:#111827; --surface-2:#111827; --line:#1E293B; --line-2:#1E293B;
  --text:#F1F5F9; --muted:#94A3B8; --accent:#38BDF8; --accent-ink:#04121c; --chip:#0B0F17;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}

/* bands */
.band{padding:104px 0;color:var(--text);background:var(--bg)}
.band.dark.alt{background:var(--bg)}
.band.light{background:var(--bg)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,15,23,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(11,15,23,.85);backdrop-filter:blur(12px)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.links a{transition:color .15s}
.links a:hover{color:var(--text)}

.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;font-weight:500}
h1{font-size:clamp(44px,6.8vw,72px);line-height:1.02;letter-spacing:-.04em;margin:0 0 22px;font-weight:700}
h2{font-size:clamp(28px,4vw,38px);letter-spacing:-.028em;margin:0 0 40px;font-weight:650;line-height:1.15}
h3{margin:0;font-size:25px;letter-spacing:-.018em;font-weight:650}
.lead{color:var(--muted);font-size:clamp(17px,2.1vw,19px);max-width:540px;margin:0 0 34px}

.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:500;border:1px solid var(--line-2);color:var(--text);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.links a:focus-visible,.mail:focus-visible,.mini a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* hero */
.hero{padding:88px 0 112px;position:relative;overflow:hidden;
  background:
    radial-gradient(700px 380px at 82% 8%,rgba(56,189,248,.12),transparent 70%),
    radial-gradient(600px 400px at 0% 100%,rgba(56,189,248,.05),transparent 70%),
    var(--bg)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
.photo-wrap{position:relative;justify-self:end;width:100%;max-width:380px}
.photo-wrap::before{content:"";position:absolute;inset:-1px;border-radius:31px;background:linear-gradient(160deg,var(--accent),transparent 50%);opacity:.75}
.photo-wrap .frame{position:relative;padding:10px;border-radius:30px;background:linear-gradient(145deg,#1E293B,#111827);border:1px solid var(--line-2);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.65),0 2px 0 rgba(255,255,255,.04) inset}
.photo-wrap img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 15%;border-radius:21px;box-shadow:0 0 0 1px rgba(241,245,249,.07);background:var(--surface)}
.mini{display:flex;gap:22px;margin-top:32px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.mini a{transition:color .15s}
.mini a:hover{color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px;margin-bottom:24px;transition:border-color .2s,box-shadow .2s}


.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:999px;padding:4px 13px;margin-bottom:16px}
.card p{color:var(--muted);margin:14px 0 0;max-width:740px}
.card p strong{color:var(--text);font-weight:600}
.pipe{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0;padding:0;list-style:none}
.pipe li{font-family:var(--mono);font-size:12.5px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--text)}
.ph{border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:14px;margin-top:22px;display:inline-block}
.projects .card:last-child{margin-bottom:0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.grid .card{margin:0;padding:30px}
.grid h3{font-size:17px;margin-bottom:12px}
.grid ul{margin:0;padding:0;list-style:none;color:var(--muted);font-size:15px}
.grid li{padding:7px 0;border-top:1px solid var(--line)}
.grid li:first-child{border-top:0}

.about p{margin:0 0 18px;color:var(--muted);max-width:700px;font-size:17px}
.about p:first-of-type{color:var(--text);font-size:20px}

.contact .box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:56px 44px;box-shadow:0 24px 50px -28px rgba(0,0,0,.6)}
.contact .lead{margin-bottom:22px}
.contact a.mail{display:inline-block;font-size:clamp(20px,4vw,32px);font-weight:650;letter-spacing:-.02em;border-bottom:2px solid var(--accent);padding-bottom:3px;word-break:break-all;transition:color .15s}
.contact a.mail:hover{color:var(--accent)}
footer{background:var(--bg);border-top:1px solid var(--line);padding:26px 0 calc(36px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px}

@media(max-width:800px){
  .links{gap:18px;font-size:13px}
  .band{padding:72px 0}
  .hero{padding:40px 0 72px}
  .hero-grid{grid-template-columns:1fr;gap:44px}
  .photo-wrap{justify-self:center;max-width:320px;order:-1}
  .card{padding:26px}
  .contact .box{padding:36px 24px}
}
@media(max-width:420px){.links a:nth-child(n+4){display:none}.wrap{padding:0 20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card{transition:none}}
</style>
</head>

function Hero() {
  return html`<section class="hero" id="top"><div class="wrap hero-grid">
    <div>
      <p class="eyebrow">AI Student · Aspiring AI Engineer</p>
      <h1>Mostafa Mohamed</h1>

      <div class="btns">

  </div></section>`;

function Projects() {
  return html`<section class="band light projects" id="projects"><div class="wrap">
    <p class="eyebrow">Projects</p>
    <h2>Selected work</h2>

    <article class="card">
      <span class="tag">Training / Graduation Project · Team</span>
      <h3>CropDoctor</h3>
      <p>NTI Data Science & ML graduation project, built with a team on the FAOSTAT Egypt agricultural dataset. Everyone on the team contributed across the workflow.</p>
      <p><strong>My part:</strong> data preprocessing, feature preparation, model training and evaluation, and API integration.</p>
      <p><strong>Models:</strong> Linear Regression, Random Forest and Logistic Regression, compared through a train-and-evaluate workflow.</p>
      <ul class="pipe">${PIPELINE.map(s => html`<li key=${s}>${s}</li>`)}</ul>
      <div class="btns" style=${{marginTop: "28px"}}>
        <${Ext} cls="btn primary" href=${LINKS.api}>Open live API ↗<//>
      </div>
    </article>

    <article class="card">
      <span class="tag">Practice / Coursework</span>
      <h3>Quiz App — Day 34, 100 Days of Code</h3>
      <p>An interactive quiz app in Python, built on Day 34 of Angela Yu’s 100 Days of Code course. It fetches multiple-choice and true/false questions from an external trivia API (Open Trivia Database) and parses the JSON response.</p>
      <p>It presents the questions one after another, tracks the player’s score, and gives immediate right or wrong feedback on each answer.</p>
      <ul class="pipe">${QUIZ.map(s => html`<li key=${s}>${s}</li>`)}</ul>
      <div class="btns" style=${{marginTop: "28px"}}>
        <${Ext} cls="btn" href=${LINKS.day34}>View code on GitHub ↗<//>
      </div>
    </article>
  </div></section>`;
}

function About() {
  return html`<section class="band dark alt about" id="about"><div class="wrap">
    <p class="eyebrow">About</p>
    <h2>Background</h2>
    <p>I’m a Computer Science student at Lotus University in Minya, Egypt, focused on AI and machine learning.</p>
    <p>I completed the NTI Data Science and Machine Learning track in November 2026. My practical work is in Python: data cleaning and preprocessing (dropping unused columns, handling missing values, label encoding), model training and evaluation, and API and deployment workflows. I put that into practice in CropDoctor, my NTI graduation project, built with a team.</p>
